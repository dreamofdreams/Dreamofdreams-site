<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hysco Merchandise | Dream of Dreams</title>
    <link rel="stylesheet" href="css/merch.css">
</head>
<body>
    <header>
        <h1>Hysco Merchandise</h1>
    </header>
    <main id="merch-browser">
        <div id="design-display">
            <img id="concept-image" src="" alt="Design Concept">
            <h2 id="design-name"></h2>
            <p id="collection-name"></p>
        </div>
        <div class="controls">
            <button id="prev-btn">Previous</button>
            <button id="save-btn">Save Design</button>
            <button id="next-btn">Next</button>
        </div>
        <div id="product-options">
            <!-- Placeholders -->
            <select><option>T-shirt</option><option>Hoodie</option></select>
            <select><option>Midnight Navy</option><option>Antique Gold</option></select>
            <select><option>S</option><option>M</option><option>L</option></select>
        </div>
        <div id="loading-state" style="display:none;">THE FORGES OF HYSCO ARE AT WORK...</div>
    </main>
    <script src="js/merch.js"></script>
</body>
</html>
