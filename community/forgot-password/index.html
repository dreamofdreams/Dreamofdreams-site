<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Request a password reset for your Dream of Dreams community account.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://dod-social-auth-gateway-190c9rby.uc.gateway.dev; img-src 'self' https: data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests">
    <title>Forgot password | Dream of Dreams Community</title>
    <link rel="stylesheet" href="../community.css">
    <link rel="stylesheet" href="../community-email-auth.css">
    <link rel="stylesheet" href="../password-reset/password-reset.css">
    <script src="forgot-password.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
        <a class="brand" href="../../index.html" aria-label="Dream of Dreams home">
            <img src="../../dream_of_dreams_logo.png" alt="" width="64" height="64">
            <span>Dream of Dreams</span>
        </a>
        <a class="home-link" href="../index.html">Community home</a>
    </header>
    <main id="main-content">
        <section class="hero reset-hero" aria-labelledby="page-title">
            <p class="eyebrow">Community account</p>
            <h1 id="page-title">Reset your password</h1>
            <p class="hero-copy">Enter the email address for your community account.</p>
        </section>
        <section class="panel reset-panel" aria-labelledby="request-title">
            <h2 id="request-title">Get a reset link</h2>
            <form id="forgot-password-form" class="reset-form">
                <div class="form-field">
                    <label for="account-email">Email address</label>
                    <input id="account-email" name="email" type="email" autocomplete="email" maxlength="254" required>
                </div>
                <button id="request-button" class="primary-button reset-submit" type="submit">Send reset link</button>
                <p id="request-message" class="form-message" role="status" aria-live="polite"></p>
            </form>
            <p><a href="../index.html">Return to login</a></p>
        </section>
    </main>
    <footer class="site-footer">
        <p>&copy; 2026 Dream of Dreams LLC</p>
        <nav aria-label="Legal">
            <a href="../../privacy-policy.html">Privacy Policy</a>
            <a href="../../terms-of-service.html">Terms of Service</a>
            <a href="../../contact.html">Contact</a>
        </nav>
    </footer>
</body>
</html>
